name: Build Android APK - Projeto Trincado

on:
  push:
    branches:
      - feature/projeto-trincado-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Download professional workout GIFs
        run: |
          python scripts/run_anatomical_gifs.py
          test "$(find public/gifs -maxdepth 1 -name '*.gif' | wc -l)" -ge 19

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK structure and Android signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | grep "package: name='com.ozorio.projetotrincado'"
          unzip -t "$APK" >/dev/null

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Projeto-Trincado-0.5.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: projeto-trincado-0.5.3-apk
          path: Projeto-Trincado-0.5.3.apk
          retention-days: 14
