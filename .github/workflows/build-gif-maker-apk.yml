name: Build Trincado GIF Maker APK

on:
  push:
    branches:
      - feature/trincado-gif-maker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | grep "package: name='com.ozorio.trincadogifmaker'"
          unzip -t "$APK" >/dev/null

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Trincado-GIF-Maker-0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trincado-gif-maker-apk
          path: Trincado-GIF-Maker-0.1.0.apk
          retention-days: 14
